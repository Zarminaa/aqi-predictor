[project]
name = "aqi-predictor"
version = "0.1.0"
description = "End-to-end AQI prediction system using OpenWeather APIs and MLOps."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Zarmina Amjad" }
]

dependencies = [
    "numpy>=2.4",
    "pandas>=2.3",
    "scikit-learn>=1.9",
    "xgboost>=3.3",
    "torch>=2.13",
    "requests>=2.34",
    "python-dotenv>=1.2",
    "supabase>=2.31",
    "hopsworks>=5.0",
    "deltalake>=1.6",
    "SQLAlchemy>=2.0",
    "boto3>=1.43",
    "GitPython>=3.1",
    "tqdm>=4.69"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.140",
    "uvicorn>=0.51"
]

dashboard = [
    "streamlit>=1.60",
    "plotly>=6.9",
    "matplotlib>=3.11",
    "shap>=0.52"
]

dev = [
    "pytest",
    "black",
    "ruff",
    "pre-commit"
]
